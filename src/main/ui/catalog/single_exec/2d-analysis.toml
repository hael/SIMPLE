help = "is a distributed workflow implementing a reference-free 2D alignment/clustering algorithm for time-series of nanoparticle images"

[[program.input]]
key = "moldiam"
label = "Molecular diameter"
help = "Molecular diameter(in Angstroms)"
placeholder = "In Angstroms"
