[[program]]
name = "reconstruct3D_pcg"
executable = "simple_exec"
display_name = "Experimental CTF/sigma-weighted PCG 3D reconstruction"
summary = "Experimental CTF/sigma-weighted PCG 3D reconstruction"
help = "is an experimental single-state 3D reconstruction program using a matrix-free, 'preconditioned-conjugate-gradient solver instead of Fourier gridding (doc/implementation_notes/'ctf_sigma_weighted_pcg_reconstruction.md). Reads a project and reconstructs one volume for one 'state from its current particle orientations, CTF, and shifts; orientations are inputs, not 'optimized. objfun=euclid requires sigma2 files and weights the fit by them; objfun=cc runs 'unweighted. nparts=1, no even/odd split, no symmetry, no distributed execution. Writes to a new 'experimental output directory and never modifies the project."
visibility = "developer"

[[program.input]]
key = "oritype"
label = "Oritype segment in project"
help = "Oritype segment in project(mic|stk|ptcl2D|cls2D|cls3D|ptcl3D|out|projinfo|jobproc|compenv){ptcl3D}"
placeholder = "(mic|stk|ptcl2D|cls2D|cls3D|ptcl3D|out|projinfo|jobproc|compenv){ptcl3D}"
visibility = "developer"
choices = ["mic", "stk", "ptcl2D", "cls2D", "cls3D", "ptcl3D", "out", "projinfo", "jobproc", "compenv"]

[[program.input]]
key = "objfun"
label = "Objective function"
help = "Objective function(euclid|cc|prob){euclid}"
placeholder = "(euclid|cc|prob){euclid}"
visibility = "developer"
choices = ["euclid", "cc", "prob"]

[[program.input]]
key = "state"
label = "State to reconstruct"
help = "Index of the single state to reconstruct"
placeholder = "state index{1}"
visibility = "developer"

[[program.input]]
key = "pcgop"
label = "PCG normal operator"
help = "Normal-operator implementation: kernel is the section-8.1 Toeplitz operator, whose 'per-iteration cost is independent of particle count and is roughly 7x faster per 'iteration; matrixfree is the exact reference operator, slower but free of the 'kernel shift-invariance approximation(matrixfree|kernel){kernel}"
placeholder = "(matrixfree|kernel){kernel}"
visibility = "developer"
choices = ["matrixfree", "kernel"]

[[program.input]]
key = "maxits"
label = "Max iterations"
help = "Maximum number of iterations"
placeholder = "Max # iterations"
visibility = "developer"

[[program.input]]
key = "rtol"
label = "PCG relative residual tolerance"
help = "Stop when the relative preconditioned residual falls below this"
placeholder = "tolerance{0.001}"
visibility = "developer"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"
visibility = "developer"

