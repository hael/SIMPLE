[[program]]
name = "cif2mrc"
executable = "all"
display_name = "PDBx/mmCIF to MRC simulator"
summary = "PDBx/mmCIF to MRC simulator"
help = "is a program to simulate a 3D density map in MRC format using a PDBx/mmCIF format coordinates file"

[[program.input]]
key = "ciffile"
label = "PDBx/mmCIF input coordinates file"
help = "Input coordinates file in PDBx/mmCIF format"
placeholder = "PDBx/mmCIF file e.g. molecule.cif"
visibility = "developer"

[[program.input]]
key = "smpd"
label = "Sampling distance"
help = "Distance between neighbouring pixels in Angstroms"
placeholder = "pixel size in Angstroms"
visibility = "developer"

[[program]]
name = "pdb2mrc"
