# MASKING
suite_id = "simple_exec"
group_id = "masking"
group_title = "MASKING"
group_order = 100

[[program]]
name = "auto_spher_mask"
executable = "simple_exec"
display_name = "spherical masking with automatic diameter estimation"
summary = "spherical masking with automatic diameter estimation"
help = "is a program for automated spherical masking"
visibility = "developer"

[[program.input]]
key = "vol1"
label = "Odd volume"
help = "Odd volume"
placeholder = "vol1.mrc file"
visibility = "developer"

[[program.input]]
key = "smpd"
label = "Sampling distance"
help = "Distance between neighbouring pixels in Angstroms"
placeholder = "pixel size in Angstroms"
visibility = "developer"

[[program.input]]
key = "amsklp"
label = "Low-pass limit for envelope mask generation"
help = "Low-pass limit for envelope mask generation in Angstroms"
placeholder = "low-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

[[program]]
name = "automask2D"
executable = "simple_exec"
display_name = "2D envelope masking"
summary = "2D envelope masking"
help = "is a program for automated envelope masking in 2D"
visibility = "developer"

[[program.input]]
key = "stk"
label = "Particle image stack"
help = "Particle image stack"
placeholder = "xxx.mrc file with particles"
visibility = "developer"

[[program.input]]
key = "smpd"
label = "Sampling distance"
help = "Distance between neighbouring pixels in Angstroms"
placeholder = "pixel size in Angstroms"
visibility = "developer"

[[program.input]]
key = "amsklp"
label = "Low-pass limit for envelope mask generation"
help = "Low-pass limit for envelope mask generation in Angstroms{20 A}"
placeholder = "low-pass limit in Angstroms{20 A}"
visibility = "developer"

[[program.input]]
key = "winsz"
label = "Window size for median filter"
help = "Window size for median filter(in pixels)"
placeholder = "winsz in pixels"
visibility = "developer"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"
visibility = "developer"

[[program.input]]
key = "ngrow"
label = "# layers to grow"
help = "Binary layers grown for molecular envelope in pixels{3}"
placeholder = "width of binary layers grown in pixels{3}"
visibility = "developer"

[[program.input]]
key = "edge"
label = "Envelope mask soft edge"
help = "Cosine edge size for softening molecular envelope in pixels{6}"
placeholder = "# pixels cosine edge{6}"
visibility = "developer"

[[program.input]]
key = "positive"
label = "Consider only positive pixels"
help = "Consider only positive pixels for threshold determination(yes|no){no}"
placeholder = "only positive(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

[[program]]
name = "mask"
executable = "simple_exec"
display_name = "Mask images/volumes"
summary = "Mask images/volumes"
help = "is a program for masking of 2D images and volumes. If you want to mask your images with a spherical mask with a soft  falloff, set mskdiam to the diameter in A"
visibility = "developer"

[[program.input]]
key = "smpd"
label = "Sampling distance"
help = "Distance between neighbouring pixels in Angstroms"
placeholder = "pixel size in Angstroms"
visibility = "developer"

[[program.input]]
key = "oritab"
label = "Orientation and CTF parameter file"
help = "Orientation and CTF parameter file in plain text (.txt) or SIMPLE project (*.simple) format"
placeholder = ".simple|.txt parameter file"
visibility = "developer"

[[program.input]]
key = "outfile"
label = "Output orientation and CTF parameter file"
help = "Output Orientation and CTF parameter file in plain text (.txt) or SIMPLE project (*.simple) format"
placeholder = ".simple|.txt parameter file"
visibility = "developer"

[[program.input]]
key = "stk"
label = "Particle image stack"
help = "Particle image stack"
placeholder = "xxx.mrc file with particles"
visibility = "developer"

[[program.input]]
key = "vol1"
label = "Volume"
help = "Volume to mask"
placeholder = "input volume e.g. vol.mrc"
visibility = "developer"

[[program.input]]
key = "center"
label = "Center input volume"
help = "Center input volume by its center of gravity(yes|no){yes}"
placeholder = "(yes|no){yes}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "lp_backgr"
label = "Background low-pass resolution"
help = "Low-pass resolution for solvent blurring"
placeholder = "low-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"
visibility = "developer"

[[program.input]]
key = "width"
label = "Falloff of inner mask"
help = "Number of cosine edge pixels of inner mask in pixels"
placeholder = "# pixels cosine edge{10}"
visibility = "developer"

[[program.input]]
key = "edge"
label = "Envelope mask soft edge"
help = "Cosine edge size for softening molecular envelope in pixels"
placeholder = "# pixels cosine edge"
visibility = "developer"

[[program.input]]
key = "taper_edges"
label = "Taper edges"
help = "Whether to taper the edges of image/volume(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "pdbfile"
label = "PDB for 3D envelope masking"
help = "PDB file used to determine the mask"
placeholder = "e.g. molecule.pdb"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
