name: Test experimental 1JXY against master

# Install this workflow on master; publish the restored suite on testing.
# Each new commit in a push gets an isolated rebase, build and verdict.
# Fixed-seed regressions and robustness profiles measure different guarantees.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  Revisions:
    if: github.event.deleted != true
    runs-on: ubuntu-26.04
    outputs:
      masters: ${{ steps.revisions.outputs.masters }}
      testing: ${{ steps.revisions.outputs.testing }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Freeze testing and enumerate master commits
        id: revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          git fetch origin master testing
          python3 - <<'PY'
          import json
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(['git'] + list(args), universal_newlines=True).strip()

          testing = git('rev-parse', 'origin/testing')
          after = os.environ['PUSH_AFTER'] if os.environ['EVENT_NAME'] == 'push' else git('rev-parse', 'origin/master')
          before = os.environ.get('PUSH_BEFORE', '')
          if before and set(before) != {'0'}:
              masters = git('rev-list', '--reverse', before + '..' + after).splitlines()
          else:
              masters = [after]
          if not masters:
              raise SystemExit('No new master commits to test')
          if len(masters) > 256:
              raise SystemExit('More than 256 commits: split the push range into smaller batches')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('masters=' + json.dumps(masters) + '\n')
              output.write('testing=' + testing + '\n')
          PY

  Test:
    needs: Revisions
    name: 1JXY on ${{ matrix.master }}
    runs-on: ubuntu-26.04
    timeout-minutes: 270
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        master: ${{ fromJSON(needs.Revisions.outputs.masters) }}
    env:
      MASTER_SHA: ${{ matrix.master }}
      TESTING_SHA: ${{ needs.Revisions.outputs.testing }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.Revisions.outputs.testing }}
          fetch-depth: 0
          persist-credentials: false
      - name: Rebase the experimental changes onto this master commit
        run: |
          mkdir -p ci-results
          printf 'master=%s\ntesting=%s\n' "$MASTER_SHA" "$TESTING_SHA" > ci-results/revisions.txt
          git config user.name 'SIMPLE testing CI'
          git config user.email 'simple-testing@users.noreply.github.com'
          base=$(git merge-base "$TESTING_SHA" origin/master)
          printf 'base=%s\n' "$base" >> ci-results/revisions.txt
          git rebase --onto "$MASTER_SHA" "$base" 2>&1 | tee ci-results/rebase.log
          git rev-parse HEAD >> ci-results/revisions.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install gcc gfortran cmake liblzma-dev libtiff-dev libwebp-dev libfftw3-dev libjpeg-dev gnuplot sqlite3 libcurl4-openssl-dev libopenblas-openmp-dev libarpack2-dev
      - name: Build SIMPLE and run the fast gate
        run: ./compile_clean.sh 2>&1 | tee ci-results/build.log
      - name: Run the 1JXY truth gates in shared memory and with two workers
        run: |
          ctest --test-dir build -R '^simulated_workflow_1jxy$' --no-tests=error --output-on-failure --output-junit "$PWD/build/1jxy-junit.xml"
      - name: Repeat the registered fixture and verify output identity
        run: |
          ctest --test-dir build -R '^simulated_workflow_1jxy$' --show-only=json-v1 > ci-results/1jxy-test.json
          python3 - <<'PYREPEAT'
          import json
          import os
          from pathlib import Path
          import subprocess

          results = Path('ci-results').resolve()
          specification = json.loads((results / '1jxy-test.json').read_text())
          tests = specification['tests']
          if len(tests) != 1 or tests[0]['name'] != 'simulated_workflow_1jxy':
              raise SystemExit('Expected exactly the registered 1JXY test')
          test = tests[0]
          properties = {item['name']: item['value'] for item in test['properties']}
          environment = os.environ.copy()
          environment.update(item.split('=', 1) for item in properties['ENVIRONMENT'])
          first = Path(properties['WORKING_DIRECTORY']).resolve()
          repeat = first.parent / '1jxy_repeat'
          repeat.mkdir()
          timeout = float(properties['TIMEOUT'])
          with (results / 'repeat.log').open('w') as log:
              subprocess.run(test['command'], cwd=str(repeat), env=environment,
                             stdout=log, stderr=subprocess.STDOUT, timeout=timeout, check=True)
          if (first / 'metrics.tsv').read_bytes() != (repeat / 'metrics.tsv').read_bytes():
              raise SystemExit('Repeated 1JXY truth metrics differ')
          command = [test['command'][0], 'test=identity', 'target=simulated_workflow_1jxy',
                     'dir1=' + str(first), 'dir2=' + str(repeat)]
          with (results / 'identity.log').open('w') as log:
              subprocess.run(command, cwd=str(results), env=environment,
                             stdout=log, stderr=subprocess.STDOUT, timeout=300, check=True)
          PYREPEAT
      - name: Retain results, including failures and rebase conflicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-1jxy-${{ matrix.master }}
          path: |
            ci-results/
            build/1jxy-junit.xml
            build/Testing/Temporary/LastTest*.log
            build/test_runs/ctest_fast.log*
            build/test_runs/1jxy_repeat/metrics.tsv
            build/test_runs/1jxy_repeat/**/simple_stats.txt
            build/test_runs/1jxy_repeat/**/solve3D_manifest.txt
            build/test_runs/1jxy_repeat/**/BENCH/*.txt
            build/test_runs/simulated_workflow_1jxy/metrics.tsv
            build/test_runs/simulated_workflow_1jxy/**/simple_stats.txt
            build/test_runs/simulated_workflow_1jxy/**/solve3D_manifest.txt
            build/test_runs/simulated_workflow_1jxy/**/BENCH/*.txt
          if-no-files-found: warn
          retention-days: 14
