# VOLUME PROCESSING
suite_id = "simple_exec"
group_id = "volume-processing"
group_title = "VOLUME PROCESSING"
group_order = 180

[[program]]
name = "center"
executable = "simple_exec"
display_name = "Center volume"
summary = "Center volume"
help = "is a program for centering a volume and mapping the shift parameters back to the particle images"
visibility = "developer"

[[program.input]]
key = "vol1"
label = "Volume"
help = "Volume to center"
placeholder = "input volume e.g. vol.mrc"
visibility = "developer"

[[program.input]]
key = "stk"
label = "Particle image stack"
help = "Particle image stack"
placeholder = "xxx.mrc file with particles"
visibility = "developer"

[[program.input]]
key = "smpd"
label = "Sampling distance"
help = "Distance between neighbouring pixels in Angstroms"
placeholder = "pixel size in Angstroms"
visibility = "developer"

[[program.input]]
key = "oritab"
label = "Orientation and CTF parameter file"
help = "Orientation and CTF parameter file in plain text (.txt) or SIMPLE project (*.simple) format"
placeholder = ".simple|.txt parameter file"
visibility = "developer"

[[program.input]]
key = "outfile"
label = "Output orientation and CTF parameter file"
help = "Output Orientation and CTF parameter file in plain text (.txt) or SIMPLE project (*.simple) format"
placeholder = ".simple|.txt parameter file"
visibility = "developer"

[[program.input]]
key = "cenlp"
label = "Centering low-pass limit"
help = "Limit for low-pass filter used in binarisation prior to determination of the center of gravity of the reference volume(s) and centering"
placeholder = "centering low-pass limit in Angstroms{30}"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

[[program]]
name = "reproject"
executable = "simple_exec"
display_name = "Re-project volume"
summary = "Re-project volume"
help = "is a program for re-projecting a volume using Fourier interpolation. Input is a SPIDER or MRC volume. Output is a stack of projection images of the same format as the inputted volume. Projections are generated by extracting central sections from the Fourier volume and back transforming the 2D FTs. nspace controls the number of projection directions. The  oritab parameter allows you to input the orientations that you wish to have your volume projected in. pgrp controls the point-group symmetry c (rotational), d (dihedral), t (tetrahedral), o (octahedral) or i (icosahedral). The point-group symmetry is used to restrict the set of projections to within the asymmetric unit. neg inverts the contrast of the projections"
visibility = "developer"

[[program.input]]
key = "vol1"
label = "Volume"
help = "Volume for creating 2D central  sections"
placeholder = "input volume e.g. vol.mrc"
visibility = "developer"

[[program.input]]
key = "outstk"
label = "Output stack name"
help = "Output images stack name"
placeholder = "e.g. outstk.mrc"
visibility = "developer"

[[program.input]]
key = "smpd"
label = "Sampling distance"
help = "Distance between neighbouring pixels in Angstroms"
placeholder = "pixel size in Angstroms"
visibility = "developer"

[[program.input]]
key = "oritab"
label = "Orientation and CTF parameter file"
help = "Orientation and CTF parameter file in plain text (.txt) or SIMPLE project (*.simple) format"
placeholder = ".simple|.txt parameter file"
visibility = "developer"

[[program.input]]
key = "neg"
label = "Invert contrast"
help = "Invert contrast(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "nspace"
label = "Number of projection directions"
help = "Number of projection directions used"
placeholder = "# projections"
visibility = "developer"

[[program.input]]
key = "pgrp"
label = "Point-group symmetry"
help = "Point-group symmetry of particle(cn|dn|t|o|i){c1}"
placeholder = "point-group(cn|dn|t|o|i){c1}"
visibility = "developer"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

