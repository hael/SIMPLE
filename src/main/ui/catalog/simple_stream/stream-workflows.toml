# STREAM WORKFLOWS
suite_id = "simple_stream"
group_id = "stream-workflows"
group_title = "STREAM WORKFLOWS"
group_order = 10

[[program]]
name = "abinitio2D_stream"
executable = "simple_stream"
display_name = "2D analysis in streaming mode"
summary = "2D analysis in streaming mode"
help = "is a distributed workflow that executes 2D analysis in streaming mode as the microscope collects the data"

[[program.input]]
key = "dir_target"
label = "Target directory"
help = "Directory where the pick_extract application is running"
placeholder = "e.g. 2_pick_extract"

[[program.input]]
key = "dir_exec"
label = "Previous run directory"
help = "Directory where previous 2D analysis took place"
placeholder = "e.g. 3_abinitio2D_stream"
visibility = "developer"

[[program.input]]
key = "ncls"
label = "Maximum number of 2D clusters"
help = "Maximum number of 2D class averages for the pooled particles subsets"
placeholder = "Maximum # 2D clusters"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"

[[program.input]]
key = "nparts"
label = "Number of computing nodes"
help = "Number of partitions for distributed memory execution. One part typically corresponds to one CPU socket in the distributed system. On a single-socket machine there may be speed benefits to dividing the jobs into a few (2-4) partitions, depending on memory capacity"
placeholder = "divide job into # parts"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"

[[program.input]]
key = "walltime"
label = "Walltime"
help = "Maximum execution time for job scheduling and management in seconds{1740}(29mins)"
placeholder = "in seconds(29mins){1740}"
visibility = "developer"

