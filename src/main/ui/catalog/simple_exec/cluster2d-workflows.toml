# CLUSTER2D WORKFLOWS
suite_id = "simple_exec"
group_id = "cluster2d-workflows"
group_title = "CLUSTER2D WORKFLOWS"
group_order = 30

[[program]]
name = "abinitio2D"
executable = "simple_exec"
display_name = "ab initio 2D analysis from particles"
summary = "ab initio 2D analysis from particles"
help = "is a distributed workflow for generating 2D class averages from particles"

[[program.input]]
key = "ncls"
label = "Number of 2D clusters"
help = "Number of groups to sort the particles into prior to averaging to create 2D class averages with improved SNR"
placeholder = "# 2D clusters"

[[program.input]]
key = "center"
label = "Center class averages"
help = "Center class averages by their center of gravity and map shifts back to the particles(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "autoscale"
label = "Automatic down-scaling"
help = "Automatic down-scaling of images for accelerated computation(yes|no){yes}"
placeholder = "(yes|no){yes}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "refine"
label = "Refinement mode"
help = "Refinement mode(prob_snhc|prob|snhc_smpl){prob_snhc}"
placeholder = "(prob_snhc|prob|snhc_smpl){prob_snhc}"
visibility = "developer"
choices = ["prob_snhc", "prob", "snhc_smpl"]

[[program.input]]
key = "sigma_est"
label = "Sigma estimation method"
help = "Sigma estimation method(group|global){global}"
placeholder = "(group|global){global}"
visibility = "developer"
choices = ["group", "global"]

[[program.input]]
key = "cls_init"
label = "Scheme for initial class generation"
help = "Initiate 2D analysis from raw images|random classes|noise images(ptcl|randcls|rand){ptcl}"
placeholder = "(ptcl|randcls|rand){ptcl}"
visibility = "developer"
choices = ["ptcl", "randcls", "rand"]

[[program.input]]
key = "nsample"
label = "Number of particles to sample"
help = "Number of particles to sample each iteration"
placeholder = "# particles to sample"
visibility = "developer"

[[program.input]]
key = "hp"
label = "High-pass limit"
help = "High-pass resolution limit"
placeholder = "high-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "cenlp"
label = "Centering low-pass limit"
help = "Limit for low-pass filter used in binarisation prior to determination of the center of gravity of the reference volume(s) and centering"
placeholder = "centering low-pass limit in Angstroms{30}"
visibility = "developer"

[[program.input]]
key = "lpstart"
label = "Initial low-pass limit"
help = "Initial low-pass resolution limit for the first stage of ab-initio model generation"
placeholder = "low-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "lpstop"
label = "Final low-pass limit"
help = "Final low-pass limit"
placeholder = "low-pass limit for the second stage (no e/o cavgs refinement) in Angstroms"
visibility = "developer"

[[program.input]]
key = "lp"
label = "Low-pass limit"
help = "Low-pass resolution limit"
placeholder = "low-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"

[[program.input]]
key = "nparts"
label = "Number of computing nodes"
help = "Number of partitions for distributed memory execution. One part typically corresponds to one CPU socket in the distributed system. On a single-socket machine there may be speed benefits to dividing the jobs into a few (2-4) partitions, depending on memory capacity"
placeholder = "divide job into # parts"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"

[[program]]
name = "abinitio2D_chunks"
