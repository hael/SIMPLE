# SYMMETRY
suite_id = "simple_exec"
group_id = "symmetry"
group_title = "SYMMETRY"
group_order = 160

[[program]]
name = "symaxis_search"
executable = "simple_exec"
display_name = "Search for symmetry axis"
summary = "Search for symmetry axis"
help = "is a program for searching for the principal symmetry axis of a volume reconstructed in C1. The rotational transformation is applied to the oritype field in the project and the project file is updated. If you are unsure about the point-group, use the symmetry_test program instead"
visibility = "developer"

[[program.input]]
key = "vol1"
label = "C1 Volume to identify symmetry axis of"
help = "C1 Volume to identify symmetry axis of"
placeholder = "input volume e.g. vol_C1.mrc"
visibility = "developer"

[[program.input]]
key = "smpd"
label = "Sampling distance"
help = "Distance between neighbouring pixels in Angstroms"
placeholder = "pixel size in Angstroms"
visibility = "developer"

[[program.input]]
key = "pgrp"
label = "Point-group symmetry"
help = "Point-group symmetry of particle(cn|dn|t|o|i){c1}"
placeholder = "point-group(cn|dn|t|o|i){c1}"
visibility = "developer"

[[program.input]]
key = "center"
label = "Center input volume"
help = "Center input volume by its center of gravity before symmetry axis search(yes|no){yes}"
placeholder = "(yes|no){yes}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "lp"
label = "Low-pass limit"
help = "Low-pass resolution limit"
placeholder = "low-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "hp"
label = "High-pass limit"
help = "High-pass resolution limit"
placeholder = "high-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "cenlp"
label = "Centering low-pass limit"
help = "Limit for low-pass filter used in binarisation prior to determination of the center of gravity of the input volume and centering"
placeholder = "centering low-pass limit in Angstroms{30}"
visibility = "developer"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

