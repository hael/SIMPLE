# AB INITIO 3D RECONSTRUCTION
suite_id = "simple_exec"
group_id = "ab-initio-3d-reconstruction"
group_title = "AB INITIO 3D RECONSTRUCTION"
group_order = 50

[[program]]
name = "abinitio3D"
executable = "simple_exec"
display_name = "3D ab initio model generation from particles"
summary = "3D ab initio model generation from particles"
help = "is a distributed workflow for generating an ab initio 3D model from particles"

[[program.input]]
key = "vol1"
label = "Starting template volume"
help = "Starting reference volume  for particle matching"
placeholder = "input starting volume e.g. vol.mrc"
visibility = "developer"

[[program.input]]
key = "center"
label = "Center reference volume(s)"
help = "Center reference volume(s) by their center of gravity and map shifts back to the particles(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "pgrp"
label = "Point-group symmetry"
help = "Point-group symmetry of particle(cn|dn|t|o|i){c1}"
placeholder = "point-group(cn|dn|t|o|i){c1}"

[[program.input]]
key = "pgrp_start"
label = "Initital point-group symmetry"
help = "Initial point-group symmetry(cn|dn|t|o|i){c1}"
placeholder = "point-group(cn|dn|t|o|i){c1}"
visibility = "developer"

[[program.input]]
key = "cavg_ini"
label = "3D initialization on class averages"
help = "3D initialization on class averages(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "cavg_ini_ext"
label = "External class-average 3D initialization"
help = "Use existing ptcl3D orientations and state assignments from a prior abinitio3D_cavgs run; skips the symmetry-search stage(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "nsample"
label = "Number of particles to sample"
help = "Number of particles to sample each iteration"
placeholder = "# particles to sample"

[[program.input]]
key = "nstages"
label = "Last ab initio stage to run"
help = "Last abinitio3D stage to run; default is 5 for multivol_mode=independent and 8 otherwise; independent mode writes final volumes at its last stage"
placeholder = "last stage"
visibility = "developer"

[[program.input]]
key = "nstates"
label = "Number of states"
help = "Number of conformational/compositional states to reconstruct"
placeholder = "# states to reconstruct"

[[program.input]]
key = "state"
label = "Continuation state label"
help = "State label to select from an existing multi-state abinitio3D project and continue as a single-state stage-5 search"
placeholder = "state label"
visibility = "developer"

[[program.input]]
key = "multivol_mode"
label = "Multi-volume ab initio mode"
help = "Multi-volume ab initio mode(single|independent|docked){single}"
placeholder = "(single|independent|docked){single}"
visibility = "developer"
choices = ["single", "independent", "docked"]

[[program.input]]
key = "objfun_den"
label = "Denoised objective"
help = "Augment raw Euclidean objective with denoised-particle correlation(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "objfun_den_w"
label = "Denoised objective weight"
help = "Weight for denoised-particle correlation in hybrid objective(0-1){0.5}"
placeholder = "(0-1){0.5}"
visibility = "developer"

[[program.input]]
key = "ptcl_src"
label = "Particle source"
help = "Particle source for matching and 3D reconstruction(raw|den){raw}"
placeholder = "(raw|den){raw}"
visibility = "developer"
choices = ["raw", "den"]

[[program.input]]
key = "projrec"
label = "Projection-direction reconstruction"
help = "Assemble raw 2D Fourier numerator/CTF-squared sums by projection direction before compact 3D reconstruction(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "hp"
label = "High-pass limit"
help = "High-pass resolution limit"
placeholder = "high-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "cenlp"
label = "Centering low-pass limit"
help = "Limit for low-pass filter used in binarisation prior to determination of the center of gravity of the reference volume(s) and centering"
placeholder = "centering low-pass limit in Angstroms{30}"
visibility = "developer"

[[program.input]]
key = "lpstart"
label = "Starting low-pass limit"
help = "Starting low-pass limit"
placeholder = "low-pass limit for the initial stage in Angstroms"
visibility = "developer"

[[program.input]]
key = "lpstop"
label = "Final low-pass limit"
help = "Final low-pass limit"
placeholder = "low-pass limit for the final stage in Angstroms; default is 6 for multivol_mode=independent and 8 otherwise"
visibility = "developer"

[[program.input]]
key = "lp"
label = "Low-pass limit"
help = "Low-pass resolution limit"
placeholder = "low-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "force_lp_range"
label = "Force low-pass range"
help = "Use lpstart/lpstop directly for abinitio3D low-pass stages instead of class-FRC-derived limits(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "filt_mode"
label = "Filtering mode"
help = "Filtering mode(none|nonuniform|nonuniform_lpset){nonuniform}; nonuniform_lpset promotes the NU frontier into an explicit merged-reference LP-set matching run"
placeholder = "(none|nonuniform|nonuniform_lpset){nonuniform}"
visibility = "developer"
choices = ["none", "nonuniform", "nonuniform_lpset"]

[[program.input]]
key = "conical_fsc"
label = "Conical FSC regularization"
help = "Use conical FSC curves when ML regularization is active(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "lpstart_ini3D"
label = "Starting low-pass limit ini3D"
help = "Starting low-pass limit ini3D"
placeholder = "low-pass limit for the initial stage of ini3D in Angstroms"
visibility = "developer"

[[program.input]]
key = "lpstop_ini3D"
label = "Final low-pass limit ini3D"
help = "Final low-pass limit ini3D"
placeholder = "low-pass limit for the final stage of ini3D in Angstroms"
visibility = "developer"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"

[[program.input]]
key = "automsk"
label = "Perform envelope masking"
help = "Whether to generate/apply an envelope mask from the staged automasking point(yes|tight|no){no}"
placeholder = "(yes|tight|no){no}"
choices = ["yes", "tight", "no"]

[[program.input]]
key = "nparts"
label = "Number of computing nodes"
help = "Number of partitions for distributed memory execution. One part typically corresponds to one CPU socket in the distributed system. On a single-socket machine there may be speed benefits to dividing the jobs into a few (2-4) partitions, depending on memory capacity"
placeholder = "divide job into # parts"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"

[[program.input]]
key = "nthr_ini3D"
label = "Number of threads for ini3D phase, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"

