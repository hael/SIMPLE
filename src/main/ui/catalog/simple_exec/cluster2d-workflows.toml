label = "Final low-pass limit"
help = "Low-pass limit that controls the degree of downsampling in the second phase. Give estimated best final resolution"
placeholder = "final low-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "mskdiam"
