# 2D ANALYSIS
suite_id = "single_exec"
group_id = "2d-analysis"
group_title = "2D ANALYSIS"
group_order = 30

[[program]]
name = "analysis2D_nano"
executable = "single_exec"
display_name = "2D analysis (centering, diameter estimation & clustering) for nanocrystal time-series"
summary = "2D analysis (centering, diameter estimation & clustering) for nanocrystal time-series"
help = "is a program for 2D analysis for nanycrystal time-series"

[[program.input]]
key = "element"
label = "Atom element name: Au, Pt etc."
help = "Atom element name: Au, Pt etc."
placeholder = "atom composition e.g. Pt"
visibility = "developer"

[[program.input]]
key = "nptcls_per_cls"
label = "Number of particles per cluster"
help = "Initial number of particles per cluster{35}"
placeholder = "# initial particles per cluster{35}"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

[[program.input]]
key = "script"
label = "Generate script for shared-mem exec on cluster"
help = "Generate script for shared-mem exec on cluster(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program]]
name = "center2D_nano"
executable = "single_exec"
display_name = "Simultaneous 2D alignment and clustering of nanoparticle images"
summary = "Simultaneous 2D alignment and clustering of nanoparticle images"
help = "is a distributed workflow implementing a reference-free 2D alignment/clustering algorithm suitable for the first pass of cleanup after time-series tracking"

[[program.input]]
key = "ncls"
label = "Number of 2D clusters"
help = "Number of groups to sort the particles into prior to averaging to create 2D class averages with improved SNR"
placeholder = "# 2D clusters"
visibility = "developer"

[[program.input]]
key = "trs"
label = "Maximum translational shift"
help = "Maximum half-width for bund-constrained search of rotational origin shifts"
placeholder = "max shift per iteration in pixels{5}"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

[[program.input]]
key = "script"
label = "Generate script for shared-mem exec on cluster"
help = "Generate script for shared-mem exec on cluster(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program]]
name = "cluster2D_nano"
executable = "single_exec"
display_name = "Simultaneous 2D alignment and clustering of time-series of nanoparticle images"
