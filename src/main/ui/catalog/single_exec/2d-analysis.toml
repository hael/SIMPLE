[[program.input]]
key = "nptcls_per_cls"
label = "Number of particles per cluster"
help = "Initial number of particles per cluster{35}"
placeholder = "# initial particles per cluster{35}"
visibility = "developer"

[[program.input]]
key = "center"
label = "Center class averages"
help = "Center class averages by their center of gravity and map shifts back to the particles(yes|no){yes}"
placeholder = "(yes|no){yes}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "winsz"
label = "Half-window size"
help = "Half-window size(frames)"
placeholder = "winsz in # frames"
visibility = "developer"

[[program.input]]
key = "maxits"
label = "Max iterations"
help = "Maximum number of iterations"
