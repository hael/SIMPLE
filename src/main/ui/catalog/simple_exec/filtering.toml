# FILTERING
suite_id = "simple_exec"
group_id = "filtering"
group_title = "FILTERING"
group_order = 80

[[program]]
name = "filter"
executable = "simple_exec"
display_name = "Filter stack/volume"
summary = "Filter stack/volume"
help = "is a program for filtering stack/volume"
visibility = "developer"

[[program.input]]
key = "outstk"
label = "Output stack name"
help = "Output images stack name"
placeholder = "e.g. outstk.mrc"
visibility = "developer"

[[program.input]]
key = "outvol"
label = "Output volume name"
help = "Output volume name"
placeholder = "e.g. outvol.mrc"
visibility = "developer"

[[program.input]]
key = "smpd"
label = "Sampling distance"
help = "Distance between neighbouring pixels in Angstroms"
placeholder = "pixel size in Angstroms"
visibility = "developer"

[[program.input]]
key = "stk"
label = "Stack to filter"
help = "Stack of images to filter"
placeholder = "e.g. stk.mrcs"
visibility = "developer"

[[program.input]]
key = "vol1"
label = "Volume to filter"
help = "Volume to filter"
placeholder = "e.g. vol.mrc file"
visibility = "developer"

[[program.input]]
key = "lp"
label = "Low-pass limit"
help = "Low-pass resolution limit"
placeholder = "low-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "hp"
label = "High-pass limit"
help = "High-pass resolution limit"
placeholder = "high-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "phrand"
label = "Phase randomization"
help = "Fouirer phase randomization by white noise substitution(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "bfac"
label = "B-factor of Gaussian low-/high-pass filter"
help = "B-factor of Gaussian low-/high-pass filter in Angstroms^2"
placeholder = "B-factor in Angstroms^2{0}"
visibility = "developer"

[[program.input]]
key = "winsz"
label = "Half-window size"
help = "Half-window size(in pixels)"
placeholder = "winsz in pixels"
visibility = "developer"

[[program.input]]
key = "width"
label = "Cosine low-pass filter falloff"
help = "Number of cosine edge pixels of Fourier low-pass filter in pixels"
placeholder = "# pixels cosine edge"
visibility = "developer"

[[program.input]]
key = "real_filter"
label = "Real-space filter"
help = "Real-space filter(median|average|stdev|bman|NLmean|no){no}"
placeholder = "(median|average|stdev|bman|NLmean|no){no}"
visibility = "developer"
choices = ["median", "average", "stdev", "bman", "NLmean", "no"]

[[program.input]]
key = "fsc"
label = "FSC file"
help = "FSC file"
placeholder = "e.g. fsc_state01.bin file"
visibility = "developer"

[[program.input]]
key = "frcs"
label = "Projection FRCs file"
help = "Projection FRCs file"
placeholder = "e.g. frcs.bin"
visibility = "developer"

[[program.input]]
key = "filter"
label = "Filter type(bs|nlmean|no){no}"
help = "Filter type(bs|nlmean|corr|no){no}"
placeholder = "(bs|nlmean|no){no}"
visibility = "developer"
choices = ["bs", "nlmean", "no"]

[[program.input]]
key = "lambda"
label = "BS smoother lambda"
help = "Strength of noise reduction"
placeholder = "(0.5-3.0){1.0}"
visibility = "developer"

[[program.input]]
key = "sigma"
label = "sigma, for Gaussian generation"
help = "sigma, for Gaussian generation(in pixels)"
placeholder = "{1.}"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

[[program]]
name = "uniform_filter2D"
executable = "simple_exec"
display_name = "Uniform 2D filter"
summary = "Uniform 2D filter"
help = "is a program for 2D uniform filter by minimizing/searching the fourier index of the CV cost function"
visibility = "developer"

[[program.input]]
key = "stk"
label = "Odd stack"
help = "Odd stack"
placeholder = "stack_even.mrc file"
visibility = "developer"

[[program.input]]
key = "stk2"
label = "Even stack"
help = "Even stack"
placeholder = "stack_odd.mrc file"
visibility = "developer"

[[program.input]]
key = "smpd"
label = "Sampling distance"
help = "Distance between neighbouring pixels in Angstroms"
placeholder = "pixel size in Angstroms"
visibility = "developer"

[[program.input]]
key = "lpstart"
label = "Starting resolution limit"
help = "Starting resolution limit (in Angstroms)"
placeholder = "in Angstroms"
visibility = "developer"

[[program.input]]
key = "lpstop"
label = "Stopping resolution limit"
help = "Stopping resolution limit (in Angstroms)"
placeholder = "in Angstroms"
visibility = "developer"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

