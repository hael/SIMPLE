{% if messages %}
  <ul id="message_alert" class="messages bg-nice4header w-full{% if messages_above_footer %} flex-shrink-0{% else %} absolute bottom-0{% endif %}">
    {% for message in messages %}
      <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}
