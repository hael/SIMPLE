name: Build SIMPLE (Linux/MacOS)

on:
  schedule:
    # Runs at 00:00 UTC every day (Nightly)
    - cron: '0 0 * * *'
      timezone: 'America/New_York'

  # manually trigger for testing
  workflow_dispatch:


jobs:
  Build:
    name: Build SIMPLE
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [24]
        os: [ubuntu-26.04, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-26.04'
        run: |
             sudo apt-get update
             echo "Install Basic Dependencies"
             sudo apt-get -y install gcc cmake liblzma-dev libtiff-dev libwebp-dev libfftw3-dev libjpeg-dev gnuplot sqlite3 nvidia-cuda-toolkit nvidia-cuda-toolkit-gcc mpich libmpich-dev libcurl4-openssl-dev libopenblas-dev liblapack-dev libarpack2-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
             /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
             echo >> /Users/runner/.bash_profile
             echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> /Users/runner/.bash_profile
             eval "$(/opt/homebrew/bin/brew shellenv)"
             brew install jbigkit
             brew install python@3.10
             brew install fftw
             brew install curl 
             brew install openblas 
             brew install lapack
             brew install arpack 
             
      - name: Build SIMPLE in debug mode (Linux/MacOS)
        run: |
             ./compile_debug.sh

      - name: Build SIMPLE GUI  (Linux/MacOS)
        run: |
             ./compile_gui.sh

  Build_coarray:
    name: Build SIMPLE with coarrays
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [24]
        os: [ubuntu-26.04, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-26.04'
        run: |
             sudo apt-get update
             echo "Install Basic Dependencies"
             sudo apt-get install -y gcc gfortran cmake liblzma-dev libtiff-dev libwebp-dev libfftw3-dev libjpeg-dev gnuplot sqlite3 openmpi-bin libopenmpi-dev libcoarrays-openmpi-dev libcurl4-openssl-dev libopenblas-dev liblapack-dev libarpack2-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
             /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
             echo >> /Users/runner/.bash_profile
             echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> /Users/runner/.bash_profile
             eval "$(/opt/homebrew/bin/brew shellenv)"
             brew install opencoarrays
             brew install jbigkit
             brew install python@3.10
             brew install fftw
             brew install curl
             brew install openblas
             brew install lapack
             brew install arpack

      - name: Build SIMPLE with coarrays (Linux/MacOS)
        run: |
             ./compile_coarrays.sh
