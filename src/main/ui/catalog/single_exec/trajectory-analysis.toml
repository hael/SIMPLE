# TRAJECTORY ANALYSIS
suite_id = "single_exec"
group_id = "trajectory-analysis"
group_title = "TRAJECTORY ANALYSIS"
group_order = 20

[[program]]
name = "extract_substk"
executable = "single_exec"
display_name = "extraction of a substack segment of time-series of metallic nanoparticles"
summary = "extraction of a substack segment of time-series of metallic nanoparticles"
help = "is a shared-memory workflow for extraction of a substack segment of time-series of metallic nanoparticles"

[[program.input]]
key = "projfile"
label = "Project file"
help = "SIMPLE projectfile"
placeholder = "e.g. myproject.simple"
visibility = "developer"

[[program.input]]
key = "fromp"
label = "From index"
help = "Start index for stack copy"
placeholder = "start index"
visibility = "developer"

[[program.input]]
key = "top"
label = "To index"
help = "Stop index for stack copy"
placeholder = "stop index"
visibility = "developer"

[[program.input]]
key = "state"
label = "State index"
help = "Only particles with this state are extracted{1}; use state<0 for legacy include-all behavior"
placeholder = "state index"
visibility = "developer"

[[program]]
name = "graphene_subtr"
executable = "single_exec"
display_name = "Removes graphene Fourier peaks in time-series"
summary = "Removes graphene Fourier peaks in time-series"
help = "Removes graphene Fourier peaks in time-series"

[[program.input]]
key = "stk_traj"
label = "Tracked NP image stack"
help = "xxx.mrc file with NP time-trajectory"
placeholder = "trajectory.mrcs"
visibility = "developer"

[[program.input]]
key = "stk_backgr"
label = "background power spectra stack, eg NP_X_background_pspec.mrc"
help = "background power spectra stack"
placeholder = "xxx.mrc file with bg spectra"
visibility = "developer"

[[program.input]]
key = "outstk"
label = "Output stack name"
help = "Output images stack name"
placeholder = "e.g. outstk.mrc"
visibility = "developer"

[[program.input]]
key = "smpd"
label = "Sampling distance"
help = "Distance between neighbouring pixels in Angstroms"
placeholder = "pixel size in Angstroms"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

[[program]]
name = "import_trajectory"
executable = "single_exec"
display_name = "Imports time-series particles stack"
summary = "Imports time-series particles stack"
help = "is a workflow for importing time-series data"

[[program.input]]
key = "stk"
label = "Particle image stack"
help = "Particle image stack"
placeholder = "xxx.mrc file with particles"
visibility = "developer"

[[program.input]]
key = "smpd"
label = "Sampling distance"
help = "Distance between neighbouring pixels in Angstroms"
placeholder = "pixel size in Angstroms"
visibility = "developer"

[[program.input]]
key = "deftab"
label = "CTF parameter file"
help = "CTF parameter file in plain text (.txt) or SIMPLE project (*.simple) format with dfx, dfy and angast values"
placeholder = ".simple|.txt parameter file"
visibility = "developer"

[[program]]
name = "trajectory_denoise"
executable = "single_exec"
display_name = "diffusion-map trajectory denoising"
summary = "diffusion-map trajectory denoising"
help = "is a program for diffusion-map denoising of an image stack"

[[program.input]]
key = "stk"
label = "Stack to denoise"
help = "Stack of images to denoise"
placeholder = "e.g. stk.mrcs"
visibility = "developer"

[[program.input]]
key = "outstk"
label = "Output stack name"
help = "Output images stack name"
placeholder = "e.g. outstk.mrc"
visibility = "developer"

[[program.input]]
key = "smpd"
label = "Sampling distance"
help = "Distance between neighbouring pixels in Angstroms"
placeholder = "pixel size in Angstroms"
visibility = "developer"

[[program.input]]
key = "neigs"
label = "Number of diffusion-map components (0 => auto; default 0)"
help = "Number of diffusion-map components (0 => auto; default 0)"
placeholder = "# eigenvecs"
visibility = "developer"

[[program.input]]
key = "pca_mode"
label = "PCA methods: diffusion maps, PPCA, PPCA plus residual kPCA, standard SVD PCA, or kernel PCA"
help = "PCA methods"
placeholder = "(diffusion_maps|ppca|ppca_kpca_resid|pca_svd|kpca){diffusion_maps}"
visibility = "developer"
choices = ["diffusion_maps", "ppca", "ppca_kpca_resid", "pca_svd", "kpca"]

[[program.input]]
key = "k_nn"
label = "Diffusion graph neighbors (default 5; try 5-30)"
help = "Local nearest neighbors used for pca_mode=diffusion_maps"
placeholder = "# neighbors"
visibility = "developer"

[[program.input]]
key = "kpca_ker"
label = "Kernel PCA kernel"
help = "Kernel PCA kernel(rbf|cosine){rbf}"
placeholder = "(rbf|cosine){rbf}"
visibility = "developer"
choices = ["rbf", "cosine"]

[[program.input]]
key = "kpca_backend"
label = "Kernel PCA backend"
help = "Kernel PCA backend(exact|nystrom){nystrom}"
placeholder = "(exact|nystrom){nystrom}"
visibility = "developer"
choices = ["exact", "nystrom"]

[[program.input]]
key = "kpca_rbf_gamma"
label = "RBF gamma (0 => auto)"
help = "RBF gamma (0 => auto)"
placeholder = "gamma"
visibility = "developer"

[[program.input]]
key = "ppca_kpca_resid_alpha"
label = "Residual hybrid damping (0 => PPCA only; default 0.5)"
help = "Residual hybrid damping (0 => PPCA only; default 0.5)"
placeholder = "hybrid alpha"
visibility = "developer"

[[program.input]]
key = "kpca_nystrom_npts"
label = "Nyström landmark count (0 => auto=max(128,2*neigs), capped at 512; try 256, 512)"
help = "Nyström landmark count (0 => auto=max(128,2*neigs), capped at 512; try 256, 512)"
placeholder = "# landmarks"
visibility = "developer"

[[program.input]]
key = "kpca_nystrom_local_nbrs"
label = "Nyström max local support neighbors (default 96; try 96, 128)"
help = "Nyström max local support neighbors (default 96; try 96, 128)"
placeholder = "# max local nbrs"
visibility = "developer"

[[program.input]]
key = "hp"
label = "High-pass limit"
help = "High-pass resolution limit"
placeholder = "high-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "lp"
label = "Low-pass limit"
help = "Low-pass resolution limit"
placeholder = "low-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

