[[program.input]]
key = "nframesgrp"
label = "# frames in time moving time window"
help = "# frames in time moving time window subjected to correction"
placeholder = "{5}"
visibility = "developer"

[[program.input]]
key = "bfac"
label = "B-factor applied to frames"
help = "B-factor applied to frames (in Angstroms^2)"
