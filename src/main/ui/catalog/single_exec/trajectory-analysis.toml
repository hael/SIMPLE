label = "Number of projection directions"
help = "Number of projection directions used"
placeholder = "# projections"
visibility = "developer"

[[program.input]]
key = "athres"
label = "Angular threshold (degrees)"
help = "Angular threshold (degrees)"
placeholder = "in degrees{10}"
visibility = "developer"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

[[program]]
name = "trajectory_reconstruct3D"
executable = "single_exec"
display_name = "Time windowed 3D reconstruction from oriented particles"
summary = "Time windowed 3D reconstruction from oriented particles"
help = "Time windowed 3D reconstruction from oriented particles"

[[program.input]]
key = "vol1"
label = "Mean volume for latent chunking"
help = "Mean volume used by flex_analysis when chunk_mode=latent"
placeholder = "input mean volume e.g. vol.mrc"
visibility = "developer"

[[program.input]]
key = "stepsz"
label = "Time window size (# frames){500}"
help = "Time window size (# frames) for windowed 3D rec{500}"
placeholder = "give # frames"
visibility = "developer"

[[program.input]]
key = "fromp"
label = "From particle index"
help = "Start index for 3D reconstruction"
placeholder = "start index"
visibility = "developer"

[[program.input]]
key = "top"
label = "To particle index"
help = "Stop index for 3D reconstruction"
placeholder = "stop index"
visibility = "developer"

[[program.input]]
key = "chunk_mode"
label = "Trajectory chunking mode"
help = "Use balanced windows or time-constrained flex-latent segmentation(balanced|latent){balanced}"
placeholder = "(balanced|latent){balanced}"
visibility = "developer"
choices = ["balanced", "latent"]

[[program.input]]
key = "nchunks"
label = "Number of temporal chunks"
help = "Fixed number of contiguous chunks; overrides the automatic count range when positive"
placeholder = "# chunks"
visibility = "developer"

[[program.input]]
key = "nchunks_min"
label = "Minimum automatic chunk count"
help = "First chunk count evaluated when nchunks is 0; set with nchunks_max to enable automatic selection"
placeholder = "minimum # chunks"
visibility = "developer"

[[program.input]]
key = "nchunks_max"
label = "Maximum automatic chunk count"
help = "Last chunk count evaluated when nchunks is 0; set with nchunks_min to enable automatic selection"
placeholder = "maximum # chunks"
visibility = "developer"

[[program.input]]
key = "chunk_count_penalty"
label = "Chunk-count penalty"
help = "Penalty per additional chunk subtracted from the adjacent-centroid temporal silhouette{0.05}"
placeholder = "nonnegative penalty"
visibility = "developer"

[[program.input]]
key = "chunk_min_len"
label = "Minimum latent chunk length"
help = "Minimum number of consecutive frames in a latent chunk; 0 uses half the average chunk length"
placeholder = "# frames"
visibility = "developer"

[[program.input]]
key = "chunk_max_len"
label = "Maximum latent chunk length"
help = "Maximum number of consecutive frames in a latent chunk; 0 uses twice the average chunk length"
placeholder = "# frames"
visibility = "developer"

[[program.input]]
key = "chunk_max_shift"
label = "Maximum boundary shift"
help = "Maximum displacement from a balanced boundary; 0 uses half the average chunk length"
placeholder = "# frames"
visibility = "developer"

[[program.input]]
key = "pgrp"
label = "Point-group symmetry"
help = "Point-group symmetry of particle(cn|dn|t|o|i){c1}"
placeholder = "point-group(cn|dn|t|o|i){c1}"
visibility = "developer"

[[program.input]]
key = "neigs"
label = "Flex latent dimensions"
help = "Maximum flex_analysis latent dimensions used for chunking{20}"
placeholder = "# modes"
visibility = "developer"

[[program.input]]
key = "maxits"
label = "Max iterations"
help = "Maximum number of iterations"
placeholder = "Max # iterations"
visibility = "developer"

[[program.input]]
key = "lp"
label = "Low-pass limit"
help = "Low-pass resolution limit"
placeholder = "low-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"
visibility = "developer"

[[program.input]]
key = "nparts"
label = "Number of computing nodes"
help = "Number of partitions for distributed memory execution. One part typically corresponds to one CPU socket in the distributed system. On a single-socket machine there may be speed benefits to dividing the jobs into a few (2-4) partitions, depending on memory capacity"
placeholder = "divide job into # parts"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

