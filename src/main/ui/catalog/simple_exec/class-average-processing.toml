# CLASS AVERAGE PROCESSING
suite_id = "simple_exec"
group_id = "class-average-processing"
group_title = "CLASS AVERAGE PROCESSING"
group_order = 40

[[program]]
name = "cluster_cavgs"
executable = "simple_exec"
display_name = "Analysis of class averages with affinity propagation"
summary = "Analysis of class averages with affinity propagation"
help = "is a program for analyzing class averages with affinity propagation"
visibility = "developer"

[[program.input]]
key = "stk"
label = "Particle image stack"
help = "Particle image stack"
placeholder = "xxx.mrc file with particles"
visibility = "developer"

[[program.input]]
key = "ncls"
label = "Number of clusters"
help = "Number of clusters"
placeholder = "# clusters"
visibility = "developer"

[[program.input]]
key = "prune"
label = "Automated particles pruning"
help = "Whether to prune deselected particles(yes|no){no}"
placeholder = "Automated particles pruning(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "clust_crit"
label = "Clustering criterion"
help = "Clustering criterion(sig|sig_clust|cc|res|hybrid){hybrid}"
placeholder = "(sig|sig_clust|cc|res|hybrid){hybrid}"
visibility = "developer"
choices = ["sig", "sig_clust", "cc", "res", "hybrid"]

[[program.input]]
key = "skip_rejection"
label = "Skip class-average rejection"
help = "Skip class-average rejection and leave project selections unchanged(yes|no){no}"
placeholder = "(yes|no){no}"
visibility = "developer"
choices = ["yes", "no"]

[[program.input]]
key = "hp"
label = "High-pass limit"
help = "High-pass resolution limit"
placeholder = "high-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "lp"
label = "Low-pass limit"
help = "Low-pass resolution limit"
placeholder = "low-pass limit in Angstroms"
visibility = "developer"

[[program.input]]
key = "mskdiam"
label = "Mask diameter"
help = "Mask diameter (in A) for application of a soft-edged circular mask to remove background noise"
placeholder = "mask diameter in A"
visibility = "developer"

[[program.input]]
key = "nthr"
label = "Number of threads per computing node, give 0 if unsure"
help = "Number of shared-memory OpenMP threads with close affinity per partition. Typically the same as the number of logical threads in a socket."
placeholder = "# shared-memory CPU threads"
visibility = "developer"

[[program]]
name = "model_cavgs_rejection"
executable = "simple_exec"
display_name = "Model-driven rejection of class averages"
summary = "Model-driven rejection of class averages"
help = "is a program for automatic class-average rejection using normalized quality feature vectors"
visibility = "developer"

[[program.input]]
